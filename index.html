@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#2b1e21}}
:root[data-theme="dark"]{--page:#2b1e21}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font-family:Cairo,Tajawal,Tahoma,sans-serif;color:var(--ink);display:flex;justify-content:center;min-height:100vh}
body.locked{overflow:hidden;height:100vh}
.card{position:relative;width:min(100%,460px);min-height:100svh;overflow:hidden;background:linear-gradient(#fff 0%,#fff7f7 55%,#fbe8eb 100%);text-align:center;padding:60px 22px 96px}
@media(min-width:520px){.card{margin:24px 0;min-height:900px;border-radius:28px;box-shadow:0 20px 60px #7a3a4a33}}
.side{position:absolute;top:0;bottom:0;width:31%;background-size:cover;pointer-events:none}
.side.l{left:0;background-image:var(--L);background-position:left top;-webkit-mask-image:linear-gradient(to right,#000 50%,transparent);mask-image:linear-gradient(to right,#000 50%,transparent)}
.side.r{right:0;background-image:var(--R);background-position:right top;-webkit-mask-image:linear-gradient(to left,#000 50%,transparent);mask-image:linear-gradient(to left,#000 50%,transparent)}
.in{position:relative;z-index:2}
.tag{font-size:18px;letter-spacing:.06em;margin:0}
.div{display:flex;align-items:center;justify-content:center;gap:0;width:150px;margin:10px auto 26px}
.div i{flex:1;height:1px;background:#b98a8e}.div b{width:5px;height:5px;background:#9c6468;transform:rotate(45deg);margin:0 -1px}
.lead{font-size:15px;line-height:2.1;margin:0 0 30px}
.t{font-size:13px;margin:0}
.name{font-family:"Aref Ruqaa",serif;font-weight:700;color:var(--rose);font-size:clamp(50px,15vw,68px);line-height:1.15;margin:2px 0 6px}
.and{font-family:"Aref Ruqaa",serif;font-size:22px;margin:0 0 10px}
.en{font-family:Cinzel,serif;letter-spacing:.38em;font-size:13px;margin:18px 0 44px;color:#8e3555}
.info{display:flex;justify-content:center;align-items:stretch;gap:0;margin:0 auto;max-width:330px}
.info>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:17px;padding:2px 0}
.info .sep{flex:0 0 1px;background:#b98a8e;margin:0 6px}
.ic{width:46px;height:46px;border-radius:50%;background:var(--seal);display:grid;place-items:center}
.ic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thanks{font-size:15px;margin:26px 0 6px}
.cd{display:flex;justify-content:center;gap:8px;margin:18px auto 24px;direction:rtl}
.cd div{width:70px;padding:10px 0 8px;border:1px solid #d9b7bc;border-radius:14px;background:#ffffffc9}
.cd b{display:block;font-size:24px;color:var(--rose);font-weight:600;line-height:1.3}
.cd span{font-size:12px}
.msg{font-family:"Aref Ruqaa",serif;font-size:20px;color:var(--rose);margin:18px 0}
.btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:210px;padding:12px 22px;border-radius:999px;font:600 15px Cairo,sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--seal);background:var(--seal);color:#fff}
.btn.o{background:#fffffff0;color:#8e3555}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn:focus-visible,.seal:focus-visible,.mus:focus-visible{outline:3px solid #8e3555;outline-offset:3px}
.mus{position:fixed;z-index:20;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;width:46px;height:46px;border-radius:50%;border:1px solid var(--seal);background:#fffffff2;color:#8e3555;cursor:pointer;display:none;place-items:center}
.open .mus{display:grid}.mus svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.mus.on{background:var(--seal);color:#fff}
.rv{opacity:0}
.open .rv{animation:up .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*.13s + .7s)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center}
.half{position:absolute;left:0;right:0;height:50%;transition:transform 1.4s cubic-bezier(.77,0,.18,1)}
.half.t{top:0;background:linear-gradient(#fff,#fdf0f1);border-bottom:1px solid #e6c6cc}
.half.b{bottom:0;background:linear-gradient(#fdf0f1,#f5d6dc)}
.open .t{transform:translateY(-101%)}.open .b{transform:translateY(101%)}
.cc{position:relative;z-index:2;text-align:center;padding:0 20px;transition:opacity .6s,transform .6s}
.open .cc{opacity:0;transform:scale(.8);pointer-events:none}
.cc .en{margin:10px 0 34px}
.seal{width:112px;height:112px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#c4597d,#8e2145);color:#fff;font:600 17px Cairo,sans-serif;cursor:pointer;box-shadow:0 8px 26px #8e214566;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 8px 36px #8e214599}}
.alt{display:block;margin:20px auto 0;background:none;border:0;color:#8e3555;font:15px Cairo,sans-serif;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){.seal{animation:none}.half,.cc{transition-duration:.01s}.open .rv{animation-duration:.01s;animation-delay:0s}}
</style>

  [[f,.09,'sine'],[f*2,.025,'triangle']].forEach(function(p){
    var o = ac.createOscillator(), g = ac.createGain();

  try{
    if (MUSIC_URL){ audio = audio || Object.assign(new Audio(MUSIC_URL),{loop:true}); audio.play(); }
    else {
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      timer = setInterval(function(){
        var t = ac.currentTime + .05, i = step++ % N.length;
        note(N[i], t, 1.6); if (i % 8 === 0) note(N[i]/4, t, 3.2);
      }, 520);
    }
    playing = true;
  }catch(e){ playing = false; }
  sync();
}
function stop(){ clearInterval(timer); if (audio) audio.pause(); playing = false; sync(); }
function sync(){ mus.classList.toggle('on', playing); mus.setAttribute('aria-pressed', playing); mus.setAttribute('aria-label', playing ? 'إيقاف الموسيقى' : 'تشغيل الموسيقى'); }
mus.onclick = function(){ playing ? stop() : play(); };

// فتح الدعوة
function openInv(withMusic){
  document.body.classList.add('open'); document.body.classList.remove('locked');
  if (withMusic) play();
  setTimeout(function(){ var c = document.getElementById('cover'); if (c) c.remove(); }, 1600);
}
document.getElementById('openBtn').onclick = function(){ openInv(false); };
document.getElementById('openMus').onclick = function(){ openInv(true); };
</script>
